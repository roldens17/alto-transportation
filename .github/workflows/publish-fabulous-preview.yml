name: Publish Fabulous Cleaning Preview
on:
  push:
    branches: [main]
    paths:
      - 'previews/fabulous-cleaning/**'
      - '.github/workflows/publish-fabulous-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: fabulous-preview-pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}fabulous-cleaning/
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stage static preview under dedicated URL
        run: |
          mkdir -p _site/fabulous-cleaning
          cp previews/fabulous-cleaning/index.html _site/fabulous-cleaning/index.html
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
