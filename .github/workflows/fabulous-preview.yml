name: Fabulous Cleaning Visual Preview
on:
  pull_request:
    paths:
      - 'previews/fabulous-cleaning/**'
      - '.github/workflows/fabulous-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate standalone premium HTML
        run: |
          test -s previews/fabulous-cleaning/index.html
          grep -qi '<!doctype html>' previews/fabulous-cleaning/index.html
          grep -q 'DESIGN PREVIEW' previews/fabulous-cleaning/index.html
          grep -q 'Booking Coming Soon' previews/fabulous-cleaning/index.html
      - name: Upload phone-friendly visual preview
        uses: actions/upload-artifact@v4
        with:
          name: fabulous-cleaning-visual-preview
          path: previews/fabulous-cleaning/index.html
          retention-days: 30
          if-no-files-found: error
