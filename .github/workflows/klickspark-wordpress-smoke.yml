name: KlickSpark WordPress Runtime Smoke
on:
  pull_request:
    paths:
      - 'wordpress/**'
      - 'generator/**'
      - 'clients/**'
      - 'scripts/klickspark-provision.sh'
      - 'docker-compose.klickspark.yml'
      - '.github/workflows/klickspark-wordpress-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  wordpress-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'PyYAML==6.0.3'
      - name: Build Fabulous Cleaning child theme
        run: node generator/src/cli.mjs build fabulous-cleaning --force
      - name: Configure disposable CI environment
        run: |
          cp .env.klickspark.example .env
          sed -i 's/^DB_PASSWORD=.*/DB_PASSWORD=ci-local-db-password/' .env
          sed -i 's/^DB_ROOT_PASSWORD=.*/DB_ROOT_PASSWORD=ci-local-root-password/' .env
          sed -i 's/^WP_ADMIN_PASSWORD=.*/WP_ADMIN_PASSWORD=ci-local-admin-password/' .env
          sed -i 's/^WP_ADMIN_EMAIL=.*/WP_ADMIN_EMAIL=ci-admin@example.com/' .env
      - name: Provision real WordPress with MariaDB
        run: bash scripts/klickspark-provision.sh
      - name: Verify theme and content in WordPress
        run: |
          docker compose --env-file .env -f docker-compose.klickspark.yml run --rm -T wpcli theme is-active fabulous-cleaning
          docker compose --env-file .env -f docker-compose.klickspark.yml run --rm -T wpcli eval 'if (!post_type_exists("ks_service")) { fwrite(STDERR, "Missing service post type\n"); exit(1); }'
          docker compose --env-file .env -f docker-compose.klickspark.yml run --rm -T wpcli post list --post_type=page --format=count | grep -Eq '^[1-9][0-9]*$'
      - name: Fetch actual homepage HTML
        run: |
          curl --fail --retry 10 --retry-delay 3 --retry-connrefused -sS http://127.0.0.1:8080/ -o /tmp/klickspark-home.html
          grep -qi 'Fabulous Cleaning' /tmp/klickspark-home.html
      - name: Show service logs on failure
        if: failure()
        run: docker compose --env-file .env -f docker-compose.klickspark.yml logs --tail=120 || true
      - name: Tear down disposable environment
        if: always()
        run: docker compose --env-file .env -f docker-compose.klickspark.yml down -v || true
