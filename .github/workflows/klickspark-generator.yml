name: KlickSpark Generator
on:
  pull_request:
    paths:
      - 'generator/**'
      - 'clients/**'
      - 'industries/**'
      - '.github/workflows/klickspark-generator.yml'
  push:
    branches: [main]
    paths:
      - 'generator/**'
      - 'clients/**'
      - 'industries/**'
jobs:
  generator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'PyYAML==6.0.3'
      - run: node --check generator/src/cli.mjs
      - run: node --test generator/test/*.test.mjs
      - run: node generator/src/cli.mjs build fabulous-cleaning --force
      - name: Lint generated PHP
        run: |
          find generated/fabulous-cleaning -name '*.php' -print0 | xargs -0 -n1 php -l
