name: KlickSpark Generator
on:
  pull_request:
    paths:
      - 'generator/**'
      - 'clients/**'
      - 'industries/**'
      - 'docker-compose.klickspark.yml'
      - '.env.klickspark.example'
      - '.github/workflows/klickspark-generator.yml'
  push:
    branches: [main]
    paths:
      - 'generator/**'
      - 'clients/**'
      - 'industries/**'
      - 'docker-compose.klickspark.yml'
      - '.env.klickspark.example'
      - '.github/workflows/klickspark-generator.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  generator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned YAML parser
        run: python -m pip install 'PyYAML==6.0.3'
      - name: Validate generator and client
        run: |
          node --check generator/src/cli.mjs
          node generator/src/cli.mjs validate fabulous-cleaning
      - name: Run generator tests
        run: node --test generator/test/*.test.mjs
      - name: Build Fabulous Cleaning theme
        run: node generator/src/cli.mjs build fabulous-cleaning --force
      - name: Lint generated PHP
        run: find generated/fabulous-cleaning -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Lint Fabulous Cleaning content seeder
        run: php -l wordpress/clients/fabulous-cleaning/seed.php
      - name: Verify generated theme and manifest
        run: node generator/test/verify-artifact.mjs fabulous-cleaning
      - name: Validate Docker Compose configuration without starting services
        run: |
          cp .env.klickspark.example .env
          docker compose --env-file .env -f docker-compose.klickspark.yml config --quiet
          rm .env
      - name: Upload generated client artifact
        uses: actions/upload-artifact@v4
        with:
          name: fabulous-cleaning-wordpress-theme
          path: generated/fabulous-cleaning/
          if-no-files-found: error
          retention-days: 14
